# GitHub Actions workflow that builds the Lua app on every push to `main`
# and commits the resulting `evidential.zip` back to the repo.

name: Build Lua zip
on:
  push:
    branches: [main]
    paths-ignore:
      - evidential/evidential.zip

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidential

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build zip via turn-app
        run: make build

      - name: Rename to unversioned filename
        run: mv evidential-*.zip evidential.zip

      - name: Commit and push zip
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidential/evidential.zip
          if git diff --cached --quiet; then
            echo "No zip changes to commit — skipping."
            exit 0
          fi
          git commit -m "chore: rebuild evidential.zip [skip ci]"
          git push