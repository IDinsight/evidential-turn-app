# GitHub Actions workflow that builds the Lua app on every push to `main`
# and publishes the resulting `evidential.zip` to a separate `builds` branch.

name: Build Lua zip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary for release notes

      - name: Build and rename
        working-directory: evidential
        run: |
          make build
          mv evidential-*.zip evidential.zip

      - name: Create Tag
        id: tag
        run: echo "version=v$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: evidential/evidential.zip